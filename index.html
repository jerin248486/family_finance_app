<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Finance Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 20px auto; padding: 20px; background: #f4f7f6; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; }
        label { font-weight: bold; display: block; margin-top: 15px; }
        input, select { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; margin-top: 20px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background: #218838; }
        .action-btn { background: #007bff; margin-top: 10px; }
        .action-btn:hover { background: #0056b3; }
        #status { margin-top: 15px; text-align: center; font-weight: bold; color: #555; }
    </style>
</head>
<body>

<div class="card">
    <h2>Family Finance Tracker</h2>
    
    <form id="financeForm">
        <label for="description">Description:</label>
        <input type="text" id="description" placeholder="E.g., Groceries at Target" required>

        <label for="amount">Amount ($):</label>
        <input type="number" step="0.01" id="amount" placeholder="0.00" required>

        <label for="category">Category:</label>
        <select id="category">
            <option value="Groceries">Groceries</option>
            <option value="Utilities">Utilities</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Dining Out">Dining Out</option>
            <option value="Other">Other</option>
        </select>

        <input type="hidden" id="method" value="Manual">

        <button type="button" class="action-btn" onclick="startVoiceRecognition()">🎤 Use Voice Entry</button>
        
        <label for="billImage" style="margin-top:15px; font-weight:bold;">📸 Scan Bill/Receipt:</label>
        <input type="file" id="billImage" accept="image/*" capture="environment">
        
        <button type="submit">Submit Expense</button>
    </form>

    <div id="status"></div>
</div>

<script>
    // --- 1. GOOGLE SHEETS CONNECTION ---
    // PASTE YOUR WEB APP URL HERE:
    const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxZ0Nim7nUbJBF3mZpmu1pqOFgYl9PFctZlpm8BOf-MB8-YvF9gSPzwpLR1icodK_64/exec';

    // --- 2. SUBMIT DATA TO GOOGLE SHEETS ---
    document.getElementById('financeForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const statusDiv = document.getElementById('status');
        statusDiv.innerText = "Submitting to Google Sheets...";
        statusDiv.style.color = "#007bff";

        const expenseData = {
            description: document.getElementById('description').value,
            amount: document.getElementById('amount').value,
            category: document.getElementById('category').value,
            method: document.getElementById('method').value
        };

        fetch(GOOGLE_SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors', // Required for simple Apps Script POSTs from a browser
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(expenseData)
        }).then(() => {
            statusDiv.innerText = "✅ Expense Logged Successfully!";
            statusDiv.style.color = "green";
            document.getElementById('financeForm').reset();
            document.getElementById('method').value = "Manual"; // Reset method
            setTimeout(() => statusDiv.innerText = "", 3000);
        }).catch(error => {
            statusDiv.innerText = "❌ Error logging expense.";
            statusDiv.style.color = "red";
            console.error('Error!', error.message);
        });
    });

    // --- 3. VOICE TO TEXT ENTRY ---
    function startVoiceRecognition() {
        if (!('webkitSpeechRecognition' in window)) {
            alert("Your browser does not support Voice Recognition. Please use Chrome.");
            return;
        }
        
        const statusDiv = document.getElementById('status');
        const recognition = new webkitSpeechRecognition();
        recognition.continuous = false;
        recognition.interimResults = false;

        recognition.onstart = function() {
            statusDiv.innerText = "Listening... Try saying 'Groceries 50 dollars'";
            statusDiv.style.color = "#e83e8c";
        };

        recognition.onresult = function(event) {
            const transcript = event.results[0][0].transcript.toLowerCase();
            statusDiv.innerText = `Heard: "${transcript}"`;
            
            // Basic logic to extract numbers and text
            const amountMatch = transcript.match(/\d+(\.\d{1,2})?/); 
            const amount = amountMatch ? amountMatch[0] : "";
            const textOnly = transcript.replace(/\d+(\.\d{1,2})?|dollars|bucks/g, "").trim();

            document.getElementById('description').value = textOnly || transcript;
            document.getElementById('amount').value = amount;
            document.getElementById('method').value = "Voice";
        };

        recognition.onerror = function(event) {
            statusDiv.innerText = "Voice recognition error. Please try again.";
        };

        recognition.start();
    }

    // --- 4. SCAN BILL / OCR (Tesseract.js) ---
    document.getElementById('billImage').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const statusDiv = document.getElementById('status');
        statusDiv.innerText = "Scanning receipt... Please wait.";
        statusDiv.style.color = "#fd7e14";

        Tesseract.recognize(
            file,
            'eng',
            { logger: m => console.log(m) } // Logs progress in browser console
        ).then(({ data: { text } }) => {
            statusDiv.innerText = "Scan complete! Trying to extract total...";
            
            // Basic attempt to find a total amount in the receipt text
            // Looks for "Total", "Amount", etc., followed by a dollar sign and numbers
            const totalRegex = /(?:total|amount|due|balance)[\s:$-]*(\d+\.\d{2})/i;
            const match = text.match(totalRegex);

            if (match && match[1]) {
                document.getElementById('amount').value = match[1];
                document.getElementById('description').value = "Scanned Receipt";
                statusDiv.innerText = "✅ Total found! Please verify.";
                statusDiv.style.color = "green";
            } else {
                // If it can't confidently find a total, it dumps a snippet of text for manual review
                document.getElementById('description').value = text.substring(0, 50).replace(/\n/g, ' ') + "...";
                statusDiv.innerText = "Could not find an exact total. Please enter manually.";
                statusDiv.style.color = "#fd7e14";
            }
            document.getElementById('method').value = "Scanned";
        }).catch(err => {
            statusDiv.innerText = "❌ Error scanning receipt.";
            console.error(err);
        });
    });
</script>

</body>
</html>
